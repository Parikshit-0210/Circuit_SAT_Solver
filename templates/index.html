<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>AI Circuit SAT Solver</title>

    <!-- Google Font -->
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;500;700&display=swap" rel="stylesheet">

    <style>
        body {
            margin: 0;
            font-family: 'Poppins', sans-serif;
            background: linear-gradient(135deg, #1e3c72, #2a5298);
            color: white;
            text-align: center;
        }

        .container {
            margin-top: 80px;
        }

        h1 {
            font-size: 42px;
            margin-bottom: 10px;
        }

        p {
            color: #dcdcdc;
        }

        .card {
            background: rgba(255, 255, 255, 0.1);
            backdrop-filter: blur(10px);
            border-radius: 20px;
            padding: 30px;
            width: 60%;
            margin: auto;
            box-shadow: 0px 10px 30px rgba(0,0,0,0.3);
        }

        button {
            background: linear-gradient(45deg, #ff6a00, #ee0979);
            border: none;
            padding: 15px 30px;
            font-size: 18px;
            color: white;
            border-radius: 30px;
            cursor: pointer;
            margin-top: 20px;
            transition: 0.3s;
        }

        button:hover {
            transform: scale(1.1);
            box-shadow: 0px 5px 20px rgba(0,0,0,0.4);
        }

        #output {
            margin-top: 20px;
            font-size: 20px;
            font-weight: bold;
            color: #00ffcc;
        }

        .results {
            margin-top: 20px;
            max-height: 250px;
            overflow-y: auto;
            text-align: left;
            padding: 10px;
            border-radius: 10px;
            background: rgba(0,0,0,0.3);
        }

        .solution {
            padding: 8px;
            border-bottom: 1px solid rgba(255,255,255,0.2);
            font-size: 14px;
        }

        .loader {
            margin-top: 20px;
            display: none;
        }

        .spinner {
            border: 5px solid #f3f3f3;
            border-top: 5px solid #00ffcc;
            border-radius: 50%;
            width: 40px;
            height: 40px;
            animation: spin 1s linear infinite;
            margin: auto;
        }

        @keyframes spin {
            100% { transform: rotate(360deg); }
        }

    </style>
</head>
<body>

<div class="container">

    <h1>🧠 AI Circuit Analyzer</h1>
    <p>Boolean Circuit Solved using SAT Solver</p>

    <div class="card">
        <h2>Run Analysis</h2>
        <button onclick="runSAT()">🚀 Run SAT Solver</button>

        <div class="loader" id="loader">
            <div class="spinner"></div>
            <p>Solving...</p>
        </div>

        <p id="output"></p>

        <div class="results" id="results"></div>
    </div>

</div>

<script>
function runSAT() {
    document.getElementById("loader").style.display = "block";
    document.getElementById("output").innerText = "";
    document.getElementById("results").innerHTML = "";

    fetch('/run_sat')
        .then(response => response.json())
        .then(data => {
            document.getElementById("loader").style.display = "none";

            document.getElementById("output").innerText =
                "✅ Total Solutions: " + data.total_solutions;

            let resultsDiv = document.getElementById("results");

            data.solutions.slice(0, 20).forEach((sol, index) => {
                let div = document.createElement("div");
                div.className = "solution";
                div.innerText = `Solution ${index+1}: ` + JSON.stringify(sol);
                resultsDiv.appendChild(div);
            });

            if (data.solutions.length > 20) {
                let more = document.createElement("div");
                more.innerText = "... showing first 20 solutions";
                resultsDiv.appendChild(more);
            }
        });
}
</script>

</body>
</html>
